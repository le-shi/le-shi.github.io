    <div class="header-actions">

      <button class="icon-button theme-toggle" type="button" aria-label="切换深浅主题" title="切换主题">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.64 5.64l1.42 1.42m9.88 9.88 1.42 1.42m0-12.72-1.42 1.42M7.06 16.94l-1.42 1.42M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/></svg>

  <div class="docs-shell">
    <aside class="docs-sidebar" aria-label="文档目录">

      </article>
    </main>

  <dialog class="search-dialog" id="search-dialog">

      <div class="search-head">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="search-input" type="search" placeholder="搜索当前文档…" autocomplete="off" aria-label="搜索当前文档">

      <div id="search-results" class="search-results"><p>输入关键词开始搜索</p></div>
